[build]
  functions = "netlify/functions"

# Aliases pratiques pour l'app (la racine "/" sert index.html = landing par défaut)
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/connexion.html"
  status = 200

[[redirects]]
  from = "/connexion"
  to = "/connexion.html"
  status = 200

[[redirects]]
  from = "/cabinet"
  to = "/cabinet.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/app.html?signup=1"
  status = 200

# Lien direct console admin (après connexion : même compte Labosync si email dans ADMIN_EMAILS)
[[redirects]]
  from = "/admin"
  to = "/app.html?admin=1"
  status = 200

[[redirects]]
  from = "/mobile"
  to = "/labo-mobile.html"
  status = 200

[[redirects]]
  from = "/courier"
  to = "/courier.html"
  status = 200

# OneSignal : fichiers statiques dans /vendor/ (onesignal-sdk.js = bundle ES6 complet, pas le loader CDN)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), notifications=(self)"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline'; script-src 'self' https://cdn.onesignal.com 'unsafe-inline'; script-src-attr 'unsafe-inline'; connect-src 'self' https: wss:; worker-src 'self' https://cdn.onesignal.com https://cdnjs.cloudflare.com blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com"

[[headers]]
  for = "/OneSignalSDKWorker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/OneSignalSDKUpdaterWorker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
