[build]
  command = "node scripts/create-deploy-backup.cjs --required --reason netlify-build && node scripts/clean-push-artifacts.cjs && npm run verify:functions"
  functions = "netlify/functions"

[functions."invoice-reminders-cron"]
  schedule = "0 7 * * *"

# Évite le 404 sur /favicon.ico (les navigateurs le demandent automatiquement) → sert l'icône SVG
[[redirects]]
  from = "/favicon.ico"
  to = "/icon.svg"
  status = 200

# Sécurité : bloque l'accès public aux fichiers internes (le site est déployé en glissant
# tout le dossier, ce qui exposait sinon code/outils/sauvegardes). On ne bloque QUE des
# extensions/dossiers jamais chargés par l'app (les scripts runtime sont en .js dans /scripts/).
# force = true est INDISPENSABLE : sans lui, Netlify sert le fichier physique existant
# et ignore la redirection. Avec force, la règle 404 prend le dessus sur le fichier.
[[redirects]]
  from = "/app.html.pre-restore-ui.bak"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/verify-netlify-functions.cjs"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/clean-push-artifacts.cjs"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/_patch-cabinet-r2.cjs"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/create-deploy-backup.cjs"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/error-report.cjs"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/deno.lock"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/lb-delivery-helpers-snippet.txt"
  to = "/index.html"
  status = 404
  force = true

# Aliases pratiques pour l'app (la racine "/" sert index.html = landing par défaut)
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/connexion.html"
  status = 200

[[redirects]]
  from = "/connexion"
  to = "/connexion.html"
  status = 200

[[redirects]]
  from = "/cabinet"
  to = "/cabinet.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/app.html?signup=1"
  status = 200

# Console administrateur (page dédiée, hors app labo)
[[redirects]]
  from = "/admin"
  to = "/admin-console.html"
  status = 200

[[redirects]]
  from = "/mobile"
  to = "/labo-mobile.html"
  status = 200

[[redirects]]
  from = "/manifest-mobile.json"
  to = "/manifest-mobile.json"
  status = 200

[[redirects]]
  from = "/courier"
  to = "/courier.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline'; script-src 'self' 'unsafe-inline'; script-src-attr 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https: wss:; worker-src 'self' blob:; img-src 'self' https: data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
