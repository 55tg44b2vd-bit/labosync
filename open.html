<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labosync</title>
<script>
(function () {
  var p = new URLSearchParams(location.search || '');
  var role = (p.get('role') || '').toLowerCase();
  var target = (p.get('target') || 'home').toLowerCase();
  var isMob = false;
  try {
    isMob =
      localStorage.getItem('lb_env') === 'mobile' ||
      /iphone|ipad|ipod|android/i.test(navigator.userAgent || '');
  } catch (e) {}

  var dest = '/app.html';
  if (role === 'cab') dest = '/cabinet.html';
  else if (role === 'lab' && isMob) dest = '/labo-mobile.html';

  var q = [];
  if (target === 'messages' || target === 'factures') q.push('open=' + target);
  q.push('from=push');
  if (q.length) dest += (dest.indexOf('?') >= 0 ? '&' : '?') + q.join('&');

  location.replace(dest);
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#475569;">
<p>Ouverture de Labosync…</p>
</body>
</html>
